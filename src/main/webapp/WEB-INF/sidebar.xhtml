<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:pm="http://primefaces.org/manhattan">

    <div class="layout-sidebar">
        <div class="layout-sidebar-logo">
            <a href="#" id="layout-sidebar-anchor" class="layout-sidebar-anchor" title="Fixar menu">
                <i class="pi"/>
            </a>
        </div>

        <div class="layout-menu-container">
            <h:form id="menuform">
                <pm:menu widgetVar="ManhattanMenuWidget">
                    <p:menuitem id="mnuDashboard" value="Início" icon="pi pi-fw pi-home" outcome="/app/dashboard"/>
                    <p:menuitem id="mnuTarefas" value="Tarefas" icon="pi pi-fw pi-check-square" outcome="/app/tarefas"/>
                    <p:menuitem id="mnuOrganizacao" value="Organização" icon="pi pi-fw pi-tags" outcome="/app/organizacao"/>
                    <p:menuitem id="mnuUsuarios" value="Usuários" icon="pi pi-fw pi-users" outcome="/admin/usuarios"
                                rendered="#{usuarioLogado.admin}"/>
                </pm:menu>
            </h:form>
        </div>
    </div>

</ui:composition>
