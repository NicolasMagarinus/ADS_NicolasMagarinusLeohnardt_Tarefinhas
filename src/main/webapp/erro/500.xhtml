<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      lang="pt-BR">

    <h:head>
        <f:facet name="first">
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        </f:facet>
        <title>Algo deu errado - TodoList</title>
    </h:head>

    <h:body styleClass="exception-body">
        <div class="exception-panel">
            <div class="exception-panel-content">
                <h1>500</h1>
                <h2>Algo deu errado</h2>
                <p class="information-text">Ocorreu um erro inesperado. Tente novamente; se continuar, avise o administrador.</p>
                <p:linkButton value="Voltar para o início" icon="pi pi-home" outcome="/app/dashboard"/>
            </div>
        </div>
    </h:body>

    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/layout-cyan-deeporange.css" library="manhattan-layout"/>
</html>
