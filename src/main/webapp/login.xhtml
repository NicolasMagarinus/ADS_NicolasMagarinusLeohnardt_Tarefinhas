<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="http://primefaces.org/ui"
      lang="pt-BR">

    <f:metadata>
        <f:viewAction action="#{loginController.verificarJaLogado}"/>
    </f:metadata>

    <h:head>
        <f:facet name="first">
            <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
            <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
        </f:facet>
        <title>Entrar - TodoList</title>
    </h:head>

    <h:body styleClass="login-body">
        <h:form id="frmLogin">
            <div class="login-panel">
                <div class="grid">
                    <div class="col-12 lg:col-6 left-side">
                        <p:graphicImage name="images/login/login-photo.png" library="manhattan-layout" class="login-image"/>
                    </div>

                    <div class="col-12 lg:col-6 right-side ui-fluid">
                        <div class="col-12 text-center">
                            <h3>TodoList</h3>
                            <h2>Entre para ver suas tarefas</h2>
                        </div>

                        <div class="col-12">
                            <p:messages id="msgs" showDetail="false" closable="true"/>
                        </div>

                        <div class="col-12">
                            <div class="input-wrapper ui-input-icon-left">
                                <i class="pi pi-user"></i>
                                <p:inputText id="email" value="#{loginController.email}"
                                             required="true" requiredMessage="Informe o e-mail."
                                             placeholder="E-mail" autocomplete="username"/>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="input-wrapper ui-input-icon-left">
                                <i class="pi pi-lock"></i>
                                <p:password id="senha" value="#{loginController.senha}"
                                            required="true" requiredMessage="Informe a senha."
                                            placeholder="Senha" autocomplete="current-password"/>
                            </div>
                        </div>

                        <div class="col-12 button-container">
                            <p:commandButton id="btnEntrar" value="Entrar" icon="pi pi-sign-in"
                                             ajax="false" action="#{loginController.entrar}"/>
                        </div>

                        <div class="col-12 link-alternativo">
                            Ainda não tem conta?
                            <h:link outcome="/cadastro" value="Criar conta"/>
                        </div>
                    </div>
                </div>
            </div>
        </h:form>
    </h:body>

    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/layout-cyan-deeporange.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/app.css"/>
</html>
